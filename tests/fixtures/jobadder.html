<!doctype html>
<form id="form">
  <div class="form-field"><label>First Name</label><input id="CandidateFirstName" name="CandidateFirstName" placeholder="First name" type="text"></div>
  <div class="form-field"><label>Last Name</label><input id="CandidateLastName" name="CandidateLastName" placeholder="Last name" type="text"></div>
  <div class="form-field"><label>Email</label><input id="CandidateEmail" name="CandidateEmail" placeholder="Email address" type="text"></div>
  <div class="form-field two-cols">
    <div class="col"><label>Mobile</label><input id="CandidateMobile" name="CandidateMobile" placeholder="Mobile number" type="text"></div>
    <div class="col"><label>Secondary Mobile</label><input id="CandidatePhone" name="CandidatePhone" placeholder="Secondary Mobile" type="text"></div>
  </div>
  <div class="form-field two-cols">
    <div class="col"><label>Street Address</label><input id="CandidateAddressLine1" name="CandidateAddressLine1" placeholder="Street Address" type="text"></div>
    <div class="col"><label>Barangay</label><input id="CandidateAddressLine2" name="CandidateAddressLine2" placeholder="Barangay" type="text"></div>
  </div>
  <div class="form-field two-cols">
    <div class="col"><label>Zip Code</label><input id="CandidateAddressPostcode" name="CandidateAddressPostcode" maxlength="20" placeholder="Zip Code" type="text"></div>
    <div class="col"><label>City</label><input id="CandidateAddressSuburb" name="CandidateAddressSuburb" placeholder="City" type="text"></div>
  </div>
  <div class="form-field"><label>Country</label><select id="CandidateAddressCountry" name="CandidateAddressCountry"><option value="">Select..</option><option value="India">India</option></select></div>
</form>
